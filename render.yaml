services:
  - type: web
    name: omnipost
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: omnipost-sqlite-data
      mountPath: /app/server/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: STATIC_WEB_DIR
        value: /app/mobile/dist
